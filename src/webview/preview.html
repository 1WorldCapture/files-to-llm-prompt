<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Files to LLM Prompt Preview</title>
    <style>
        body { 
            padding: 20px; 
            color: var(--vscode-editor-foreground);
            font-family: var(--vscode-editor-font-family);
            background-color: var(--vscode-editor-background);
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 20px;
            height: 100vh;
            margin: 0;
            box-sizing: border-box;
            overflow: hidden;
        }
        .search-container {
            position: relative;
            margin-bottom: 10px;
            width: 90%;
        }
        .search-input {
            width: 100%;
            padding: 6px 8px;
            border: 1px solid var(--vscode-input-border);
            background: var(--vscode-input-background);
            color: var(--vscode-input-foreground);
            border-radius: 4px;
            outline: none;
            font-family: var(--vscode-font-family);
        }
        .search-input:focus {
            border-color: var(--vscode-focusBorder);
        }
        .search-results {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--vscode-dropdown-background);
            border: 1px solid var(--vscode-dropdown-border);
            border-radius: 4px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 1000;
        }
        .search-results.visible {
            display: block;
        }
        .search-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 8px;
            cursor: pointer;
            border-bottom: 1px solid var(--vscode-dropdown-border);
        }
        .search-item:last-child {
            border-bottom: none;
        }
        .search-item:hover {
            background: var(--vscode-list-hoverBackground);
        }
        .search-item-name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-right: 8px;
        }
        .search-match {
            background-color: var(--vscode-editor-findMatchHighlightBackground);
            border-radius: 2px;
        }
        
        .search-item-score {
            font-size: 0.8em;
            opacity: 0.7;
            margin-left: 8px;
        }
        .add-file-btn {
            background: var(--vscode-button-background);
            color: var(--vscode-button-foreground);
            border: none;
            padding: 2px 8px;
            border-radius: 3px;
            cursor: pointer;
        }
        .add-file-btn:hover {
            background: var(--vscode-button-hoverBackground);
        }
        .selected-files-section {
            display: flex;
            flex-direction: column;
            height: 50%;
            min-height: 0;
        }
        .file-list-container {
            border: 1px solid var(--vscode-panel-border);
            border-radius: 4px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow-y: auto;
            box-sizing: border-box;
        }
        .file-list-header {
            font-weight: bold;
            margin-bottom: 10px;
            padding: 5px;
            background: var(--vscode-editor-lineHighlightBackground);
            border-radius: 3px;
        }
        .file-list {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 10px;
            min-height: 0;
        }
        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 8px;
            margin: 2px 0;
            border-radius: 3px;
            background: var(--vscode-list-hoverBackground);
        }
        .file-item:hover {
            background: var(--vscode-list-activeSelectionBackground);
        }
        .file-name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-right: 8px;
            font-family: var(--vscode-editor-font-family);
            color: var(--vscode-foreground);
        }
        .remove-file {
            flex-shrink: 0;
            background: var(--vscode-button-background);
            color: var(--vscode-button-foreground);
            border: none;
            padding: 2px 8px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.9em;
        }
        .remove-file:hover {
            background: var(--vscode-button-hoverBackground);
        }
        .excluded-container {
            margin-top: 20px;
            border-top: 1px solid var(--vscode-panel-border);
            padding-top: 10px;
            padding-bottom: 10px;
            display: flex;
            flex-direction: column;
            height: 50%;
            min-height: 0;
        }
        .excluded-header {
            font-weight: bold;
            margin-bottom: 10px;
            padding: 5px;
            background: var(--vscode-editor-lineHighlightBackground);
            border-radius: 3px;
        }
        .excluded-list {
            font-family: var(--vscode-editor-font-family);
            overflow-y: auto;
            flex: 1;
            min-height: 0;
        }
        .excluded-item {
            padding: 4px 0;
            display: flex;
            flex-direction: column;
        }
        .excluded-path {
            color: var(--vscode-foreground);
        }
        .excluded-pattern {
            font-size: 0.9em;
            color: var(--vscode-descriptionForeground);
            margin-left: 20px;
        }
        .excluded-directory {
            font-weight: bold;
        }
        .preview-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 16px;
            gap: 12px;
            box-sizing: border-box;
            overflow: hidden;
        }
        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--vscode-panel-border);
        }
        .preview-actions {
            display: flex;
            gap: 8px;
        }
        .action-button {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: var(--vscode-button-background);
            color: var(--vscode-button-foreground);
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .action-button:hover {
            background: var(--vscode-button-hoverBackground);
        }
        .button-icon {
            font-size: 14px;
        }
        .preview-settings {
            display: flex;
            align-items: center;
        }
        .token-count {
            margin-right: 16px;
            color: var(--vscode-descriptionForeground);
            font-size: 12px;
        }
        .tree-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--vscode-foreground);
            cursor: pointer;
        }
        .tree-toggle input[type="checkbox"] {
            position: relative;
            appearance: none;
            width: 16px;
            height: 16px;
            border: 1px solid var(--vscode-checkbox-border);
            border-radius: 3px;
            background: var(--vscode-checkbox-background);
            cursor: pointer;
        }
        .tree-toggle input[type="checkbox"]:checked {
            background: var(--vscode-checkbox-selectBackground);
            border-color: var(--vscode-checkbox-selectBorder);
        }
        .tree-toggle input[type="checkbox"]:checked::after {
            content: "✓";
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 16px;
            height: 16px;
            color: var(--vscode-checkbox-foreground);
            font-size: 12px;
        }
        .sync-warning {
            display: none;
            padding: 8px 12px;
            background: var(--vscode-inputValidation-warningBackground);
            border: 1px solid var(--vscode-inputValidation-warningBorder);
            border-radius: 4px;
            font-size: 12px;
            color: var(--vscode-inputValidation-warningForeground);
            align-items: center;
            gap: 8px;
        }
        .sync-warning.visible {
            display: flex;
        }
        .warning-icon {
            font-size: 14px;
        }
        .preview-content {
            flex: 1;
            padding: 12px;
            background: var(--vscode-editor-background);
            border: 1px solid var(--vscode-panel-border);
            border-radius: 4px;
            overflow-y: auto;
            font-family: var(--vscode-editor-font-family);
            font-size: var(--vscode-editor-font-size);
            line-height: 1.5;
            white-space: pre-wrap;
        }
        button {
            background: var(--vscode-button-background);
            color: var(--vscode-button-foreground);
            border: none;
            padding: 6px 12px;
            border-radius: 3px;
            cursor: pointer;
        }
        button:hover {
            background: var(--vscode-button-hoverBackground);
        }
        #preview {
            flex: 1;
            white-space: pre-wrap;
            font-family: var(--vscode-editor-font-family);
            padding: 10px;
            border: 1px solid var(--vscode-panel-border);
            border-radius: 4px;
            overflow-y: auto;
        }
        .file-count {
            font-size: 0.9em;
            color: var(--vscode-descriptionForeground);
            margin-top: 5px;
        }
        .warning-icon {
            margin-right: 6px;
        }
        .prompt-container {
            margin-top: 20px;
            border-top: 1px solid var(--vscode-panel-border);
            padding-top: 16px;
        }

        .prompt-input {
            width: 100%;
            height: 100px;  /* 5行高度 */
            padding: 12px;
            background: var(--vscode-editor-background);
            color: var(--vscode-editor-foreground);
            border: 1px solid var(--vscode-panel-border);
            border-radius: 4px;
            font-family: var(--vscode-editor-font-family);
            font-size: var(--vscode-editor-font-size);
            resize: none;
            line-height: 1.5;
        }

        .prompt-input:focus {
            outline: none;
            border-color: var(--vscode-focusBorder);
        }
    </style>
</head>
<body>
    <div class="file-list-container">
        <div class="selected-files-section">
            <div class="search-container">
                <input type="text" 
                    class="search-input" 
                    id="fileSearch" 
                    placeholder="Search for files...">
                <div class="search-results" id="searchResults"></div>
            </div>
            <div class="file-list-header">Selected Files</div>
            <div class="file-list" id="fileList"></div>
            <div class="file-count" id="fileCount"></div>
        </div>

        <div class="excluded-container">
            <div class="excluded-header">Excluded Content</div>
            <div class="excluded-list" id="excludedList"></div>
        </div>
    </div>
    <div class="preview-container">
        <div class="preview-header">
            <div class="preview-actions">
                <button id="copyButton" class="action-button">
                    <span class="button-icon">📋</span>
                    Copy
                </button>
                <button id="refreshButton" class="action-button">
                    <span class="button-icon">🔄</span>
                    Refresh
                </button>
            </div>
            
            <div class="preview-settings">
                <span class="token-count">Tokens: 0</span>
                <label class="tree-toggle">
                    <input type="checkbox" id="includeTreeStructure">
                    <span class="toggle-label">Include Tree Structure</span>
                </label>
            </div>
        </div>
        
        <div id="syncWarning" class="sync-warning">
            <span class="warning-icon">⚠️</span>
            Preview is out of sync with selected files. Click 'Refresh' to update.
        </div>
        
        <div class="prompt-container">
          <textarea 
              id="promptInput" 
              class="prompt-input" 
              placeholder="Enter your custom prompt here..."></textarea>
        </div>
        
       <div id="preview" class="preview-content">Preview content will appear here once a file is selected...</div>
    </div>
    <script>
        const vscode = acquireVsCodeApi();
        const preview = document.getElementById('preview');
        const fileList = document.getElementById('fileList');
        const fileCount = document.getElementById('fileCount');
        const promptInput = document.getElementById('promptInput');
        let selectedFiles = TEMPLATE_FILES;
        let currentContent = '';
        let currentPrompt = '';
        let previewTokens = 0;  // 预览内容的token数量
        let promptTokens = 0;   // 提示词的token数量

        // 更新总token显示的函数
        function updateTotalTokensDisplay() {
            const totalTokens = previewTokens + promptTokens;
            const tokenDisplay = totalTokens >= 1000 ? `${(totalTokens/1000).toFixed(2)}k` : totalTokens;
            document.querySelector('.token-count').textContent = `Tokens: ${tokenDisplay}`;
        }

        function updateFileCountDisplay() {
            fileCount.textContent = `${selectedFiles.length} file${selectedFiles.length === 1 ? '' : 's'} selected`;
        }

        function highlightMatches(fileName, searchTerm) {
            if (!searchTerm) return fileName;
            
            const escapedSearchTerm = searchTerm.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const regex = new RegExp(escapedSearchTerm, 'gi');
            return fileName.replace(regex, match => 
                `<span class="search-match">${match}</span>`
            );
        }

        function formatFilePath(fullPath) {
            const normalizedPath = fullPath.replace(/\\/g, '/');
            const parts = normalizedPath.split('/');
            const fileName = parts[parts.length - 1];
            return '.../' + fileName;
        }

        function renderFileList() {
            fileList.innerHTML = selectedFiles.map(file => {
                const formattedPath = formatFilePath(file);
                return '<div class="file-item">' +
                    '<span class="file-name" title="' + file + '">' + formattedPath + '</span>' +
                    '<button class="remove-file" data-file="' + file + '">Remove</button>' +
                    '</div>';
            }).join('');
            updateFileCountDisplay();

            document.querySelectorAll('.remove-file').forEach(button => {
                button.addEventListener('click', (e) => {
                    const file = e.target.dataset.file;
                    vscode.postMessage({ 
                        type: 'removeFile', 
                        file: file 
                    });
                });
            });
        }

        function renderExcludedList(entries) {
            const excludedList = document.getElementById('excludedList');
            
            function renderEntry(entry, level = 0) {
                const indent = '  '.repeat(level);
                const itemClass = entry.type === 'directory' ? 'excluded-directory' : '';
                
                let html = `
                    <div class="excluded-item">
                        <div class="excluded-path ${itemClass}">
                            ${indent}${entry.type === 'directory' ? '📁' : '📄'} ${entry.displayPath}
                        </div>
                        <div class="excluded-pattern">
                            ${indent}Pattern: ${entry.pattern}
                        </div>
                    </div>
                `;
                
                if (entry.children) {
                    html += entry.children
                        .map(child => renderEntry(child, level + 1))
                        .join('');
                }
                
                return html;
            }
            
            excludedList.innerHTML = entries.map(entry => renderEntry(entry)).join('');
        }

        window.addEventListener('message', event => {
            const message = event.data;
            switch (message.type) {
                case 'updatePreviewContent':
                    currentContent = message.content;
                    preview.textContent = message.content;
                    previewTokens = message.tokenCount;  // 只更新预览内容的token数量
                    updateTotalTokensDisplay();  // 更新显示的总数
                    break;
                case 'updatePromptTokens':
                    promptTokens = message.tokenCount;  // 只更新提示词的token数量
                    updateTotalTokensDisplay();  // 更新显示的总数
                    break;
                case 'updateFileList':
                    selectedFiles = message.files;
                    renderFileList();
                    break;
                case 'updateAvailableFiles':
                    debugLog(`Received ${message.files.length} available files`);
                    availableFiles = message.files;
                    break;
                case 'updateExcludedContent':
                    renderExcludedList(message.entries);
                    break;
                case 'initializeTreeStructure':
                    document.getElementById('includeTreeStructure').checked = message.enabled;
                    break;
                case 'searchResults':
                    const filteredFiles = message.files.filter(file => 
                        !selectedFiles.includes(file)
                    );
                    debugLog('Received ' + filteredFiles.length + ' search results');

                    if (filteredFiles.length > 0) {
                        const searchTerm = document.getElementById('fileSearch').value;
                        searchResults.innerHTML = filteredFiles
                            .map(file => {
                                const fileName = formatFilePath(file);
                                const highlightedName = highlightMatches(fileName, searchTerm);
                                
                                return `
                                    <div class="search-item">
                                        <span class="search-item-name" title="${file}">
                                            ${highlightedName}
                                        </span>
                                        <button class="add-file-btn" data-file="${file}">Add</button>
                                    </div>
                                `;
                            }).join('');
                        searchResults.classList.add('visible');
                    } else {
                        searchResults.innerHTML = '<div class="search-item">No matches found</div>';
                        searchResults.classList.add('visible');
                    }
                    break;
                case 'updateSyncStatus':
                    const warningElement = document.getElementById('syncWarning');
                    if (!message.isInSync) {
                        warningElement.classList.add('visible');
                    } else {
                        warningElement.classList.remove('visible');
                    }
                    break;
            }
        });

        document.getElementById('copyButton').addEventListener('click', () => {
            const combinedContent = `${currentContent}\n<instruction>\n${currentPrompt}\n</instruction>`;
            
            navigator.clipboard.writeText(combinedContent)
                .then(() => {
                    vscode.postMessage({ type: 'info', message: 'Content copied to clipboard' });
                })
                .catch(err => {
                    vscode.postMessage({ type: 'error', message: 'Failed to copy content' });
                });
        });

        document.getElementById('refreshButton').addEventListener('click', () => {
            vscode.postMessage({ type: 'refresh' });
            vscode.postMessage({ type: 'info', message: 'Preview content refreshed' });
        });

        document.getElementById('includeTreeStructure').addEventListener('change', (e) => {
            const isChecked = e.target.checked;
            vscode.postMessage({ 
                type: 'updateTreeStructure',
                enabled: isChecked
            });
        });

        const searchInput = document.getElementById('fileSearch');
        const searchResults = document.getElementById('searchResults');
        let availableFiles = [];

        function debugLog(message) {
            vscode.postMessage({ 
                type: 'debug', 
                message: `Search Debug: ${message}` 
            });
        }

        async function updateSearchResults(searchTerm) {
            if (!searchTerm.trim()) {
                searchResults.classList.remove('visible');
                return;
            }

            try {
                vscode.postMessage({ 
                    type: 'searchFiles', 
                    searchTerm: searchTerm 
                });
            } catch (error) {
            }
        }

        let debounceTimeout;
        searchInput.addEventListener('input', (e) => {
            debugLog('Search input changed');
            clearTimeout(debounceTimeout);
            debounceTimeout = setTimeout(() => {
                updateSearchResults(e.target.value);
            }, 300);
        });

        document.addEventListener('click', (e) => {
            if (!searchResults.contains(e.target) && 
                e.target !== searchInput) {
                searchResults.classList.remove('visible');
            }
        });

        searchResults.addEventListener('click', (e) => {
            const addButton = e.target.closest('.add-file-btn');
            if (addButton) {
                const file = addButton.dataset.file;
                debugLog('Adding file: ' + file);
                vscode.postMessage({ 
                    type: 'addFile', 
                    file: file 
                });
                searchInput.value = '';
                searchResults.classList.remove('visible');
            }
        });

        searchInput.addEventListener('focus', () => {
            if (searchInput.value.trim()) {
                updateSearchResults(searchInput.value);
            }
        });

        // 监听提示词输入变化
        promptInput.addEventListener('input', (e) => {
            currentPrompt = e.target.value;
            vscode.postMessage({ 
                type: 'updatePrompt',
                prompt: currentPrompt
            });
        });

        renderFileList();
    </script>
</body>
</html>
